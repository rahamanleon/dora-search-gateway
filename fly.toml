# fly.toml app configuration file generated for dora-search-gateway--3zrfw on 2026-11-06T01:48:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dora-search-gateway--3zrfw'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  CACHE_TTL_MS = '300000'
  HOST = '0.0.0.0'
  PORT = '8080'
  RATE_LIMIT_MAX = '60'
  RATE_LIMIT_WINDOW_MS = '60000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 40

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '20s'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
